# 示例：构建后通过 SSH + rsync 部署到自己的服务器。需要仓库 secrets：
# DEPLOY_HOST、DEPLOY_USER、DEPLOY_PATH、DEPLOY_SSH_KEY。默认只允许手动触发。
name: Deploy (rsync)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm test && pnpm build
      - name: rsync
        run: |
          install -m 600 /dev/null ~/key
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/key
          rsync -az --delete -e "ssh -i ~/key -o StrictHostKeyChecking=accept-new" dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
