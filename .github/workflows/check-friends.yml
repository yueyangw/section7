# 每周检测友链可达性；失败时开 issue 提醒，不自动删除。
name: Check friends
on:
  schedule: [{ cron: '0 2 * * 1' }]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检测
        id: check
        run: |
          : > failed.txt
          grep -E '^\s+url:' src/data/friends.yaml | sed -E 's/.*url:\s*//' | while read -r u; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$u" || echo 000)
            case "$code" in 2*|3*) ;; *) echo "- $u ($code)" >> failed.txt ;; esac
          done
          [ -s failed.txt ] && echo "failed=1" >> "$GITHUB_OUTPUT" || true
      - name: 开 issue
        if: steps.check.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "友链不可达 $(date +%F)" --body-file failed.txt
