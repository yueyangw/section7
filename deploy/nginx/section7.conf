# 站点：纯静态 dist/，由 rsync 上传到 /var/www/wyy.ink
server {
    listen 80;
    server_name wyy.ink;
    root /var/www/wyy.ink;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown application/xml;
    # brotli on; brotli_types ...;   # 需要 ngx_brotli 模块

    # 旧 Typecho 链接 301（迁移脚本生成，见 BUILD.md 12.6）
    include /etc/nginx/snippets/wyy-redirects.conf;

    # 原文路由使用正确的 MIME
    location ~ ^/posts/.+\.md$ {
        default_type text/markdown;
        charset utf-8;
    }
    location = /llms.txt { default_type text/plain; charset utf-8; }

    # 哈希资源长缓存，HTML 不缓存
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~ ^/(_dither|_img)/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}

# 评论服务反向代理（示例）
server {
    listen 80;
    server_name comments.wyy.ink;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
