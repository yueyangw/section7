# Artalk 评论服务（SQLite 数据卷）。首次启动后创建管理员：
#   docker compose exec artalk artalk admin
# 然后编辑 ./data/artalk.yml：
#   - site_default / trusted_domains 写 https://wyy.ink（CORS）
#   - moderator.pending_default: true  → 评论先审核后显示
#   - email.enabled: true + SMTP 配置  → 邮件通知
services:
  artalk:
    image: artalk/artalk-go:latest
    container_name: artalk
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:23366'
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - ATK_LOCALE=zh-CN
